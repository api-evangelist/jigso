source: https://www.jigso.io/mcp-for-enterprise
description: >-
  Jigso markets an enterprise MCP platform as a first-class product - it has its
  own top-level nav item and product page - describing itself as "an
  enterprise-ready MCP platform that connects all your internal tools to AI with
  security and ease", connecting Gmail, Slack, Jira, HubSpot, Salesforce,
  Zendesk, Office 365, BigQuery and Snowflake to assistants such as ChatGPT and
  Claude. The product is real. What is NOT published anywhere public is the
  thing an MCP client needs: no endpoint URL, no install command, no package, no
  tool list, no auth scheme, no configuration snippet. Access appears to be
  provisioned per tenant through the sales motion (https://www.jigso.io/get-a-quote).
deployment:
  mode: none
  auth: unknown
  verified: searched
  note: >-
    `mode: none` is used because no reachable server could be verified, not
    because the provider ships nothing. Jigso does operate an MCP platform; it
    simply publishes no address for it. Every candidate endpoint was probed and
    none is an MCP server: api.jigso.io/mcp and /v1/mcp return the SAME host-wide
    401 JSON envelope that "/" and every other path on that host returns
    (an authentication wall, not an MCP OAuth challenge); app.jigso.io/mcp
    returns a CloudFront 403 "distribution is not configured to allow the HTTP
    request method that was used" to POST and a 404 to GET (a CDN artifact, not
    a server); mcp.jigso.io does not resolve. No endpoint URL has been guessed
    or invented.
